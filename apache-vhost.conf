# ---------------------------------------------------------------------------
# VirtualHost Apache untuk KanzaBridge (CodeIgniter 4)
#
# Struktur CI4 di image:
#   /var/www/html/app      <- kode aplikasi   (di luar DocumentRoot)
#   /var/www/html/vendor   <- dependency       (di luar DocumentRoot)
#   /var/www/html/writable <- cache/log/session (di luar DocumentRoot)
#   /var/www/html/public   <- DocumentRoot, satu-satunya yang bisa diakses web
#
# Rule rewrite (clean URL, forwarded slash, header Authorization) tetap
# diambil dari public/.htaccess, jadi di sini mod_rewrite harus diizinkan
# lewat `AllowOverride All`.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
	DocumentRoot /var/www/html/public

	<Directory /var/www/html/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
		DirectoryIndex index.php index.html
	</Directory>

	# ------------------------------------------------------------------------
	# Pengaman lapis kedua.
	#
	# Folder-folder ini sudah berada di luar DocumentRoot sehingga tidak bisa
	# dijangkau lewat URL. Aturan ini hanya jaga-jaga, mis. kalau suatu saat
	# DocumentRoot salah setelan atau ada symlink yang bocor.
	# ------------------------------------------------------------------------
	<DirectoryMatch "^/var/www/html/(app|vendor|writable|tests)/?">
		Require all denied
	</DirectoryMatch>

	# Berkas sensitif di root project (/var/www/html/*.env, spark, dll).
	<Directory /var/www/html>
		<FilesMatch "^\.env|^\.git|composer\.(json|lock)$|^spark$|^preload\.php$">
			Require all denied
		</FilesMatch>
	</Directory>

	# ------------------------------------------------------------------------
	# Header Authorization
	#
	# Route /api    memakai JWT  (Authorization: Bearer ...)
	# Route /api/v2 memakai API key (X-API-Key), tetap butuh header ini lolos.
	#
	# CGIPassAuth hanya relevan kalau nanti Apache diganti ke php-fpm, tapi
	# tidak berbahaya sekarang. SetEnvIf menutup jalur yang tidak dilalui
	# mod_rewrite.
	# ------------------------------------------------------------------------
	CGIPassAuth On
	SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

	# Log aplikasi masuk ke `docker compose logs`, bukan file di dalam image.
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>